<!--练习
编写一个用户注册页面，提交用户注册信息到test01.htm页面
页面头部有标题、编码
页面内容有：
h1标题：用户注册
xx行2列表格:
  行1：用(中间有若干空格，使得冒号上下对齐)户名；用户名文本框
  行2：密码：密码框
  行3：确认密码：密码框
  行4：性别：男单选按钮 女单选按钮
  行5：爱好：下拉列表，选项有：请选择、旅游、游泳、阅读、购物
  行6：提交按钮；重置按钮；
  行7：复选按钮：注册为高级会员
  行8：文字为用户注册协议的超链接，网址链接到test01.htm页面
表格外是一个图片，点击后在新窗口打开百度。
-->
<!DOCTYPE html>
<html>
    <head>
        <title>用户注册页面</title>
        <meta charset="UTF-8">
    </head>

    <body>
        <!--提交用户注册信息到test01.html页面-->
        <form action="test01.html" method="get">
         <h1>用户注册页面</h1>
         <table border="1">
            <tr>
                <td>用&nbsp;&nbsp;户&nbsp;&nbsp;名：</td>
                <td><input type="text" name="username" id="username"></td>
            </tr>

            <tr>
                <td>密&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;码：</td>
                <td><input type="password" name="password" id="password"></td>
            </tr>

            <tr>
                <td>确认密码&nbsp;:</td>
                <td><input type="password" name="confirmPassword" id="confirmPassword"></td>
            </tr>

            <tr>
                <td>性&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;别:</td>
                <td>
                    <input type="radio" name="sex" id="M">男
                    <input type="radio" name="sex" id="F">女
                </td>
            </tr>

            <tr>
                <td>爱&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;好：</td>
                <td>
                    <select name="hobby">
                        <option value="select">请选择爱好</option>
                        <option value="travel">旅游</option>
                        <option value="music">音乐</option>
                        <option value="swim">游泳</option>
                        <option value="reading">阅读</option>
                        <option value="shopping">购物</option>
                        <option value="photography">摄影</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td> <input type="submit" value="提交"> </td>
                <td> <input type="reset" value="重置">  </td>
            </tr>

            <tr>
                <td>
                    <input type="checkbox" name="supermember">注册为高级会员
                </td>
            </tr>
           
            <tr>
                <td>
                    <a href="test01.html" >用户注册协议</a>
                </td>
            </tr>
        </table>
        <a href="https://www.bing.com/" target="_blank" >
            <img src="../Asset/OIP.webp" alt="点击打开必应" width="800px">
        </a>
    </body>
</html>
