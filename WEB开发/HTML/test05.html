<html>
    <head>
        <title>测试05</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <div>
            <b>这是一个加粗段落</b>
        </div>
        <div>
            <i>这是一个斜体段落</i>
        </div>
        <div>
            <u>这是一个下划线段落</u>
        </div>
        <div>
            <s>这是一个删除线段落</s>
        </div>
        <!--b,i,u,s标签用于定义段落的样式
        b标签用于定义段落为加粗
        i标签用于定义段落为斜体
        u标签用于定义段落为下划线
        s标签用于定义段落为删除线-->
        <div>
            <font color="#FF3214" size="6" face="草书">这是一个红色段落</font>
            <!--font标签用于定义段落的字体
            color属性用于定义字体的颜色
            size属性用于定义字体的大小
            face属性用于定义字体的样式-->
        </div>
        <div id="a1" name="a2" class="a3 a4" style="color: red;">
            姓名:<input type="text" value="张三" tabindex="1">
            年龄:<input type="text" value="18" tabindex="2">
            性别:<input type="radio" name="a5" value="男">男
                <input type="radio" name="a5" value="女">女
                &nbsp;
                <!--&nbsp;标签用于定义空格new blank space-->
                爱好:<input type="checkbox" name="a6" value="篮球">篮球
                <input type="checkbox" name="a6" value="足球">足球
            <!--常用属性,主要供css和javascript使用
            id属性用于定义元素的唯一标识符,页面中只能有一个id属性
            name属性用于定义元素的名称,页面中可以有多个name属性
            class属性用于定义元素的类名,页面中可以有多个class属性
            style属性用于定义元素的样式
            tabindex属性用于定义元素的焦点顺序,数值越小,焦点顺序越靠前
            value属性用于定义元素的默认值,页面加载时显示在元素中-->
            <!--特殊字符,用于定义元素的特殊属性
            &lt;用于定义小于号
            &gt;用于定义大于号
            &amp;用于定义与号
            &copy;用于定义版权符号
            &reg;用于定义注册商标符号
            &trade;用于定义商标符号
            &euro;用于定义欧元符号
            &pound;用于定义英镑符号
            &yen;用于定义日元符号
            &cent;用于定义分符号-->
        </div>
        <div id="a1" name="a2" class="a3 a4" style="color: red;">
            

        </div>
    </body>
    
</html>
