<html>
    <head>
        <title>测试页面</title>
    </head>
    <body>
        <!--h1到h6是6个标题标签,从大到小,分别表示不同的标题等级-->
        <h1>1级别标题,最大的标题</h1>
        <h2>2级别标题</h2>
        <h3>3级别标题</h3>
        <hr width="60%" align="left" color="red">
        <!--hr标签用于插入水平分割线,属性值是数字,单位是像素,默认值为1px
        属性:width,align,color 
        width:宽度,单位是像素,默认值为1px
        align:对齐方式,可选值为left,right,center
        color:颜色,默认值为黑色 可以是字段名,也可以是颜色值-->
        <h4>4级别标题</h4>
        <h5>5级别标题</h5>
        <h6>6级别标题,最小的标题</h6>
        <ol>
            <li>小米14</li>
            <li>小米14 Pro</li>
            <li>小米14 Ultra</li>
        </ol>
        <ul type="square">
            <li>比亚迪</li>
            <li>领跑</li>
            <li>特斯拉</li>
        </ul>
        <!--ol标签用于有序列表,ul标签用于无序列表
        li标签用于列表项,只能作为ol或ul的子标签-->
        <dl>
            <dt>比亚迪</dt>
            <dd>奇瑞</dd>
            <dt>lead</dt>
            <dd>leadCG</dd>
            <dt>特斯拉</dt>
            <dd>特斯拉model3</dd>
        </dl>
        <!--dl标签用于定义列表,dt标签用于定义列表项,dd标签用于定义列表项的描述
        dt标签必须在dd标签之前-->
    </body>
</html>
