<html>
    <head>
        <title>测试页面</title>
        <meta charset="utf-8">
    <script>
//浏览器为javascript内置很多对象函数,用于处理用户交互、操作DOM树等 自上而下执行
//这些对象函数可以在javascript代码中直接调用
//弹出框函数 例如:alert()、prompt()、confirm()等 

//alert()函数 弹出提示框,显示信息给用户
alert(100)
alert("hello world")
alert(true)

//confirm()函数 弹出确认框,要求用户确认操作,有确定和取消两个按钮  
//返回用户是否确认操作 且有返回值	(true或false)
x=confirm("确定删除吗？")
alert(x);


//prompt()函数 弹出输入对话框,要求用户输入信息
//返回用户输入的信息
y=prompt("请输入姓名")
alert(y+",你好");

    </script>  
    </head>
    <body>

    </body>
</html>
